apiVersion: v1
kind: ConfigMap
metadata:
  name: kuro-config
  namespace: kuro-system      
data:
  kuro-emulation.yaml: |
    config_version: "v1.0.1"
    workloads:
      - pod_name: "test-pod-client"
        rate_limit:
          rate_bps: 10000000
          burst_bytes: 30000
        netem:
          delay_ms: 50
          loss_ppm: 50000

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kuro-controller-sa
  namespace: kuro-system     
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kuro-controller-role
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kuro-controller-binding
subjects:
- kind: ServiceAccount
  name: kuro-controller-sa
  namespace: kuro-system 
roleRef:
  kind: ClusterRole
  name: kuro-controller-role
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kuro-controller
  namespace: kuro-system 
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kuro-controller
  template:
    metadata:
      labels:
        app: kuro-controller
    spec:
      serviceAccountName: kuro-controller-sa
      containers:
        - name: controller
          image: kuro-controller:dev
          imagePullPolicy: IfNotPresent
          command: ["/app/controller"]
          args:
            - "--config=/etc/kuro/kuro-emulation.yaml"
            - "--verbose=true"
            - "--namespace=kuro-system" 
            
          volumeMounts:
            - name: config-volume
              mountPath: /etc/kuro
      volumes:
        - name: config-volume
          configMap:
            name: kuro-config
