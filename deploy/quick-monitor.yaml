# ==============================================================================
# 6. Grafana Datasource ConfigMap
# ==============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
  namespace: kuro-monitor
  labels:
    grafana_datasource: "1"
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
---
# ==============================================================================
# 7. Grafana Dashboard Provider ConfigMap
# ==============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: kuro-monitor
data:
  dashboard-provider.yaml: |
    apiVersion: 1
    providers:
      - name: 'kuro'
        orgId: 1
        folder: ''
        folderUid: ''
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards
---
# ==============================================================================
# 8. Grafana
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: kuro-monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "admin"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: "Editor"
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: "/var/lib/grafana/dashboards/kuro-network-metrics.json"
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
          volumeMounts:
            - name: dashboard-volume
              mountPath: /var/lib/grafana/dashboards
            - name: dashboard-provider-volume
              mountPath: /etc/grafana/provisioning/dashboards
            - name: datasource-volume
              mountPath: /etc/grafana/provisioning/datasources
      volumes:
        - name: dashboard-volume
          configMap:
            name: grafana-dashboard-kuro
        - name: dashboard-provider-volume
          configMap:
            name: grafana-dashboard-provider
        - name: datasource-volume
          configMap:
            name: grafana-datasource
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: kuro-monitor
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30092

