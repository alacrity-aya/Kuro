apiVersion: v1
kind: ServiceAccount
metadata:
  name: kuro-agent-sa
  namespace: kuro-system 
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kuro-agent-role
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kuro-agent-binding
subjects:
- kind: ServiceAccount
  name: kuro-agent-sa
  namespace: kuro-system
roleRef:
  kind: ClusterRole
  name: kuro-agent-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kuro-agent
  namespace: kuro-system
  labels:
    app: kuro-agent
spec:
  selector:
    matchLabels:
      app: kuro-agent
  template:
    metadata:
      labels:
        app: kuro-agent
    spec:
      serviceAccountName: kuro-agent-sa
      hostNetwork: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"
      - key: "node-role.kubernetes.io/master"
        operator: "Exists"
        effect: "NoSchedule"
      containers:
      - name: agent
        image: kuro-agent:dev
        imagePullPolicy: IfNotPresent
        command: ["/app/agent"]
        args: ["--port=50051"]
        securityContext:
          privileged: true
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: KUBECONFIG
          value: ""
        volumeMounts:
        - name: containerd-sock
          mountPath: /run/containerd/containerd.sock
        - name: bpf-fs
          mountPath: /sys/fs/bpf
          mountPropagation: Bidirectional
        - name: lib-modules
          mountPath: /lib/modules
          readOnly: true
        - name: debug-fs
          mountPath: /sys/kernel/debug
      volumes:
      - name: containerd-sock
        hostPath:
          path: /run/containerd/containerd.sock
          type: Socket
      - name: bpf-fs
        hostPath:
          path: /sys/fs/bpf
          type: DirectoryOrCreate
      - name: lib-modules
        hostPath:
          path: /lib/modules
      - name: debug-fs
        hostPath:
          path: /sys/kernel/debug
