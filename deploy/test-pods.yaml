apiVersion: v1
kind: Pod
metadata:
  name: iperf-server
  namespace: kuro-experiment
  labels:
    app: iperf-server
spec:
  nodeName: kuro-dev-worker  
  containers:
  - name: server
    image: nicolaka/netshoot
    command: ["iperf3", "-s"]
    ports:
    - containerPort: 5201
---
apiVersion: v1
kind: Pod
metadata:
  name: iperf-client
  namespace: kuro-experiment
  labels:
    app: iperf-client
spec:
  nodeName: kuro-dev-worker 
  containers:
  - name: client
    image: nicolaka/netshoot
    command: ["sleep", "3600"]
