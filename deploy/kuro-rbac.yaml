apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kuro-agent-role
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"] 
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kuro-agent-binding
subjects:
- kind: ServiceAccount
  name: default      
  namespace: default 
roleRef:
  kind: ClusterRole
  name: kuro-agent-role
  apiGroup: rbac.authorization.k8s.io
