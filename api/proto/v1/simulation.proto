syntax = "proto3";

package kuro.simulation.v1;

option go_package = "kuro/api/v1;kurov1";

// SimulationAgentService defines the communication between Node Agent and
// Central Controller.
service SimulationAgentService {
  rpc ControlStream(stream AgentMsg) returns (stream ControllerCmd);
}

// =============================================================
// Messages: Agent -> Controller
// =============================================================

message AgentMsg {
  int64 timestamp = 1;

  oneof payload {
    Heartbeat heartbeat = 2;
    PodLifecycleEvent pod_event = 3;
    CommandAck ack = 4;
  }
}

message Heartbeat {
  string node_name = 1;
  string node_ip = 2;
  int32 managed_pod_count = 3;
}

message PodLifecycleEvent {
  enum EventType {
    ADDED = 0;
    MODIFIED = 1;
    DELETED = 2;
  }
  EventType type = 1;

  string pod_name = 2;
  string namespace = 3;
  string pod_ip = 4;
  string container_id = 5;
  int32 host_ifindex = 6;
}

message CommandAck {
  string command_id = 1;
  bool success = 2;
  string message = 3;
}

// =============================================================
// Messages: Controller -> Agent
// =============================================================

message ControllerCmd {
  string command_id = 1;

  oneof payload {
    // [REPLACED] Old SyncPeerWhitelist is gone.
    // 1. Link Policy: Update 'topology_policy_map' (Src->Dst)
    ApplyLinkPolicy apply_link_policy = 2;

    // 2. Pod Policy: Update 'rate_map' (Default Interface Limits)
    ApplyPodPolicy apply_policy = 3;

    // 3. Node Policy: Update XDP Ingress (Eth0)
    ApplyNodePolicy apply_node_policy = 4;

    // New: Probe tasks for RTT detection
    ApplyProbeTask apply_probe_task = 5;
    RemoveProbeTask remove_probe_task = 6;
  }
}

// Defines a specific unidirectional link property
message ApplyLinkPolicy {
  string src_ip = 1;
  string dst_ip = 2;

  // If policy is nil/missing, it means "Delete Policy" (Revert to System
  // Traffic)
  LinkPolicy policy = 3;
}

// Maps to 'struct link_policy' in map.h
message LinkPolicy {
  uint64 bandwidth_bps = 1;       // Bandwidth limit (0 = Default Sim Rate)
  uint64 base_latency_ns = 2;     // Propagation delay
  uint64 jitter_ns = 3;           // Jitter amplitude
  uint32 corruption_rate_ppm = 4; // Packet loss per million
  uint64 queue_depth_ns = 5;      // Max queue depth (0 = Global Default)
}

message ApplyPodPolicy {
  string pod_name = 1;
  string namespace = 2;

  // Bandwidth Limits (Interface Default)
  RateLimit sim_rate = 3;
  RateLimit sys_rate = 4;
}

message RateLimit {
  uint64 upload_bps = 1;   // Pod -> Host
  uint64 download_bps = 2; // Host -> Pod
}

message ApplyNodePolicy {
  uint64 ingress_limit_bps = 1;
  uint64 ingress_burst_bytes = 2;
}

// =============================================================
// Probe Task Messages (RTT Detection)
// =============================================================

enum ProbeType {
  SIM = 0;
  SYS = 1;
}

message ApplyProbeTask {
  string task_id = 1;
  string src_pod = 2;
  string src_ip = 3;
  string dst_pod = 4;
  string dst_ip = 5;
  ProbeType type = 6;
  int32 interval_seconds = 7;
  int32 target_port = 8;
}

message RemoveProbeTask {
  string task_id = 1;
}
