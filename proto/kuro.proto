syntax = "proto3";

package kuro;
option go_package = "kuro/proto";

service AgentService {
  rpc ControlStream(stream ClientMessage) returns (stream ServerMessage);
  rpc ReportTraffic(stream TrafficStats) returns (ReportAck);
}

message ClientMessage {
  oneof payload {
    Hello hello = 1;
    Ack ack = 2;
    Heartbeat heartbeat = 3;
  }
}

message Hello {
  string host_name = 1; // generated by client
  string ip = 2;        // client ip
  string agent_version = 3;
  repeated string capabilities = 4;
}

message ServerMessage {
  oneof payload {
    ApplyNodeConfig apply_config = 1;
    Heartbeat heartbeat = 2;
    Ack ack = 3;
  }
}

message TrafficStats {
  // metadata
  string node_name = 1;
  string iface_name = 2;

  // flow
  uint64 total_accepted_bytes = 3;
  uint64 total_dropped_bytes = 4;
  uint64 total_accepted_packets = 5;
  uint64 total_dropped_packets = 6;

  // rate
  double instant_rate_bps = 7;
  double smooth_rate_bps = 8;

  // time point
  uint64 timestamp = 9;
}

message ApplyNodeConfig {
  string host_name = 1;
  VxlanConfig vxlan = 2;
  repeated NodeConfig nodes = 3;
}

message VxlanConfig {
  uint32 vni = 1;
  uint32 port = 2;
  string iface = 3;
  string group_ip = 4;
  string src = 5;
}

message NodeConfig {
  string name = 1;
  NodeType type = 2;
  string ip = 3;

  oneof runtime {
    ContainerNodeConfig container = 4;
    ExecNodeConfig exec = 5;
  }

  TrafficShaping traffic_shaping = 6;
  Netem netem = 7;
}

enum NodeType {
  NODE_TYPE_UNSPECIFIED = 0;
  EXEC = 1;
  CONTAINER = 2;
}

message ContainerNodeConfig {
  // reserved for future
}

message ExecNodeConfig {
  string exec = 1;
  repeated string args = 2;
  string cwd = 3;
}

message TrafficShaping {
  uint64 rate_bps = 1;
  uint64 burst_bytes = 2;
}

message Netem {
  double loss = 1;
  double jitter_ms = 2;
  double delay_ms = 3;
}

//
// =======================
// Common / Control
// =======================
//

message ReportAck {
  bool ok = 1;
  string message = 2;
}

message Ack {
  string ref_id = 1; // id of the message being acknowledged
  bool ok = 2;
  string message = 3;
}

message Heartbeat { int64 timestamp = 1; }
