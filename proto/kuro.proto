syntax = "proto3";
package kuro;
option go_package = "kuro/api";

// --------------------
// Control-plane (server → client)
// --------------------
service TopologyService {
  rpc SetRateLimit(SetRateLimitRequest) returns (SetRateLimitResponse);
  // rpc GetTrafficStats(GetTrafficStatsRequest) returns
  // (GetTrafficStatsResponse);
  // // rpc RunNode(RunNodeRequest) returns (RunNodeResponse);
  // // rpc TearDown(TearDownRequest) returns (TearDownResponse);
  //
  // rpc ApplyTopology(ApplyTopologyRequest) returns (ApplyTopologyResponse);
  // rpc SetNetem(SetNetemRequest) returns (SetNetemResponse);
  // rpc ClearNetem(ClearNetemRequest) returns (ClearNetemResponse);
  //
  // rpc StartNode(StartNodeRequest) returns (StartNodeResponse);
  // rpc StopNode(StopNodeRequest) returns (StopNodeResponse);
  //
  // rpc ListNodes(ListNodesRequest) returns (ListNodesResponse);
}

message SetRateLimitRequest {
  string iface_name = 1;
  uint64 rate_bytes = 2;
  uint64 burst_bytes = 3;
}

message SetRateLimitResponse {
  bool success = 1;
  string message = 2;
}

