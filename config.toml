[[host]]
name = "hostA"

[host.vxlan]
vni = 42            #VNI
iface = "lo"
port = 4789
group = "224.0.0.1" # group ip
src = "127.0.0.1"

[[host.node]]
name = "node1"
type = "exec"
exec = "iperf3"
args = ["-s"]
cwd = "/home/alacrity"
ip = "10.10.0.1/24"

[host.node.traffic_shaping]
rate_bps = 12_500_0    # bytes per second
burst_bytes = 80_000_0

[host.node.netem]
loss = 0.1
jitter_ms = 100
delay_ms = 1000

[[host.node]]
name = "node2"
type = "exec"
exec = "sleep"
args = ["3"]
cwd = "/home/alacrity"
ip = "10.10.0.2/24"


###############################

[[host]]
name = "hostB"

[host.vxlan]
id = 42             #VNI
iface = "wlp0s20f3"
port = 4789
group = "224.0.0.1"
src = "127.0.0.1"


[[host.node]]
name = "node1"
type = "exec"
exec = "iperf3"
args = ["-s"]
cwd = "/home/alacrity"
ip = "10.10.0.1/24"

[host.node.traffic_shaping]
rate_bps = 12_500_0    # bytes per second
burst_bytes = 80_000_0

[host.node.netem]
loss = 0.1
jitter_ms = 100
delay_ms = 1000
limit = 10000

[[host.node]]
name = "node2"
type = "exec"
exec = "ping"
args = ["127.0.0.1"]
cwd = "/home/alacrity"
ip = "10.10.0.2/24"
