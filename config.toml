[rule]

[[rule.cgroups]]

path = "/opt/server"
args = "kuro-kawaii"
gress = "ingress"
time_scale = "1s"
rate_bps = "10M"


[[rule.cgroups]]

path = "/opt/client"
args = "kuro-kawaii"
gress = "egress"
time_scale = "1s"
rate_bps = "10M"

