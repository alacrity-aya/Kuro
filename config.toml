# ###########################################
# # Top-level: Simulation hosts (multi-host)
# ###########################################
[[host]]
name = "hostA"

[host.vxlan]
id = 42              #VNI
iface = "wlp0s20f3"
port = 4789
remote = "127.0.0.1" # remote host for vxlan fallback

###########################################
# Nodes in hostA
###########################################
[[host.node]]
name = "node1"
type = "container"       # container | exec 
container = "sim-node-1"
image = "ubuntu:latest"
ip = "10.10.0.1/24"

[host.node.traffic_shaping]
rate_bps = 12_500_000    # bytes per second
burst_bytes = 80_000_000

[host.node.netem]
loss = 0.1
jitter_ms = 1000
delay_ms = 10


###########################################
[[host.node]]
name = "node2"
type = "exec"
exec = "iperf3"
args = ["-s"]
cwd = "/workspace"
ip = "10.10.0.2/24"


[[host.route]]
dest_ip = "10.10.0.1" # exact-match IP (eBPF uses exact match)
out_node = "node1"


[[host.route]]
dest_ip = "10.10.0.2" # exact-match IP (eBPF uses exact match)
out_node = "node2"
