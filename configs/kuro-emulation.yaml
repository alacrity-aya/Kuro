# ==========================================
# Kuro Network Topology Definition v2.1
# ==========================================
apiVersion: kuro.io/v1alpha1
kind: NetworkTopology
metadata:
  # [需求1] 实验标识
  name: "experiment-drone-cluster-01"
  namespace: "kuro-experiment" 

spec:
  defaults:
    physical_capacity: "1000Mbps"
    
    # 默认背景流量策略 (未命中任何 Link 规则的流量)
    background_rate: "900Mbps"
    background_burst: "100KB"

  nodes:
    - name: "drone-follower-0" 

    - name: "drone-leader-0"
      config:
        physical_capacity: "10Gbps" 
        background_rate: "5Gbps"

    - name: "ground-station-0"

  links:
    - source: "drone-leader-0"
      target: "drone-follower-0"
      
      selector:
        mode: "topology_aware" 

      qos:
        burst: "200KB" 
        
        shaping_type: "tbf"
        
        bandwidth: "20Mbps"
        latency: "10ms"
        loss: "0.1%"

    - source: "drone-follower-0"
      target: "ground-station-0"
      
      selector:
        mode: "manual"
        protocol: "UDP"
        dest_port: 8080
      
      qos:
        bandwidth: "5Mbps"
        burst: "50KB" 
        latency: "100ms"
