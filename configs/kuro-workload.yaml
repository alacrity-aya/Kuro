# ==========================================
# Kuro Experiment Workload Definition
# ==========================================
apiVersion: kuro.io/v1alpha1
kind: ExperimentWorkload
metadata:
  name: "drone-cluster-infra"
  namespace: "kuro-experiment"
spec:
  components:
    - name: "drone-leader"
      replicas: 1
      image: "nicolaka/netshoot:latest"
      command: ["sleep", "infinity"]
      resources:
        limits:
          cpu: "500m"
          memory: "512Mi"

    - name: "drone-follower"
      replicas: 1
      image: "nicolaka/netshoot:latest"
      command: ["sleep", "infinity"]
      env:
        LEADER_ADDR: "drone-leader-0.drone-leader" 
      resources:
        limits:
          cpu: "500m"
          memory: "512Mi"

    - name: "ground-station"
      replicas: 1
      image: "nicolaka/netshoot:latest"
      command: ["sleep", "infinity"]
      resources:
        limits:
          cpu: "1000m"
          memory: "1Gi"
