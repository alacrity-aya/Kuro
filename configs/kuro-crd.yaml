apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: experimentworkloads.kuro.io
spec:
  group: kuro.io
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                components:
                  type: array
                  items:
                    type: object
                    required: ["name", "replicas", "image"]
                    properties:
                      name:
                        type: string
                        description: "Component name, used for generating Pod name prefix"
                      replicas:
                        type: integer
                        minimum: 1
                      image:
                        type: string
                      command:
                        type: array
                        items:
                          type: string
                      args:
                        type: array
                        items:
                          type: string
                      env:
                        type: object
                        additionalProperties:
                          type: string
                        description: "Environment variables key-value pairs"
                      resources:
                        type: object
                        properties:
                          limits:
                            type: object
                            properties:
                              cpu:
                                type: string
                              memory:
                                type: string
                          requests:
                            type: object
                            properties:
                              cpu:
                                type: string
                              memory:
                                type: string
  scope: Namespaced
  names:
    plural: experimentworkloads
    singular: experimentworkload
    kind: ExperimentWorkload
    shortNames:
      - ew
